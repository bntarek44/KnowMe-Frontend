<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>معلوماتك الشخصية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">




</head>
<body>
      <!-- الناف بار -->
  <nav id="mainNav" class="navbar navbar-expand-lg  p-2">
      <div class="container-fluid">
          <select id="langSelect" class="form-select language-selector responsive-select" onchange="setLanguage(this.value)" style="max-width: 100px; ">
              <option value="ar" data-key="ar">العربية</option>
              <option value="en" data-key="en">English</option>
          </select>

          <select class="form-select mode-select responsive-select" aria-label="اختيار الوضع" onchange="changeMode(this.value)" style="max-width: 220px; ">
              <option value="light-gray1" data-key="lightGray1">فاتح - رمادي فاتح جداً</option>
              <option value="light-gray2" data-key="lightGray2" >فاتح - رمادي فاتح</option>
              <option value="light-beige" data-key="lightBeige" selected>فاتح - بيج فاتح</option>
              <option value="light-purple" data-key="lightPurple">فاتح - بنفسجي فاتح</option>
              <option value="light-pink" data-key="lightPink">فاتح - بينك فاتح</option>
              <option value="dark-gray1" data-key="darkGray1">داكن - رمادي داكن</option>
              <option value="dark-gray2" data-key="darkGray2">داكن - رمادي أغمق</option>
              <option value="dark-blue" data-key="darkBlue">داكن - أزرق داكن</option>
              <option value="dark-brown" data-key="darkBrown">داكن - بني غامق</option>
              <option value="dark-red" data-key="darkRed">داكن - أحمر غامق</option>
          </select>
      </div>
  </nav>
  <!-- بلوك المعلومات الشخصية -->
  <div class="container ">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-10 col-md-8 col-lg-6">
        <div class="profile-card">
          <img id="userPhoto" src="./images/gravater-icon.jpg" class="profile-img" alt="الصورة الشخصية">

          <div class="profile-info">
            <h3 id="userName">اسم المستخدم</h3>
            <p>
              <strong data-key="emailLabel">البريد الإلكتروني:</strong>
              <span id="userEmail">email@example.com</span>
            </p>
              <p>
              <strong data-key="createdAt">تاريخ التسجيل:</strong>
              <span id="createdAt">now</span>
            </p>


        
          </div>

          <a href="#" data-key="getLink" class="btn w-75 btn-edit google-btn" id="URLButton"  >
            احصل على الرابط
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- احصائيات ترتيب الاصدقاء -->
  <div class="container card mt-4 p-3 shadow-sm rounded-4" id="Friends_Static_Card">
    <h4 class="mb-3" data-key="friends_StaticBox">🏆 ترتيب أصدقائك</h4>

    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead >
          <tr >
            <th>#</th>
            <th data-key="friendCol">الصديق</th>
            <th data-key="emailCol"> البريد الألكتروني</th>
            <th data-key="trueCol">إجابات صحيحة</th>
            <th data-key="ratioCol">نسبة النجاح</th>
          </tr>
        </thead>
        <tbody id="friends-ranking-body">
          <!-- يتم ملؤه بالجافاسكربت -->
        </tbody>
      </table>
    </div>
  </div>

  <!--احصائيات الكويزات الل اني جاوبتها -->
  <div class="container card mt-4 p-3 shadow-sm rounded-4" id="Quizes_static_Card">
    <h4 class="mb-3" data-key="Quizes_staticBox">🏆 التحديات الل حليتها عن أصدقائك</h4>

    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle">
        <thead >
          <tr >
            <th>#</th>
            <th data-key="ownerCol">صاحب التحدي</th>
            <th data-key="emailCol"> البريد الألكتروني</th>
            <th data-key="yourTrueCol">إجاباتك صحيحة</th>
            <th data-key="ratioCol">نسبة النجاح</th>
          </tr>
        </thead>
        <tbody id="quizes-ranking-body">
          <!-- يتم ملؤه بالجافاسكربت -->
        </tbody>
      </table>
    </div>
  </div>





<!-- ✅ البلوك الأخير في الصفحة -->
 <div class="container my-5">

  <!-- الأزرار -->
  <div class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
    <button id="logoutBtn" data-key="logOut"  class="btn btn-secondary custom-btn w-75 w-md-auto">
      🔓 تسجيل خروج
    </button>

    <button id="editAnswersBtn" data-key="updateAnswer"  class="btn custom-btn btn-info  w-75 w-md-auto">
      ✏️ تعديل إجاباتك
    </button>

    <button id="deleteAccountBtn" data-key="deleteAccount" class="btn btn-danger custom-btn w-75 w-md-auto">
      🗑️ حذف الحساب
    </button>
  </div>

  <!-- رابط واتساب -->
  <div class="text-center mt-4">
    <a href="https://wa.me/201029467830" data-key="WhatsApp" target="_blank" class="text-decoration-none d-inline-flex align-items-center gap-2">
      تواصل معنا عبر واتساب
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="واتساب" width="24" height="24">

    </a>
  </div>


</div> 





<!-- الموديلز -->
<div id="profile-modal-overlay"></div>
<!-- موديل الترحيب والرسايل -->
<div id="profile-madal"  role="dialog" aria-modal="true" aria-labelledby="profile-modal-text">
  <p id="profile-modal-text" ></p>
  <button id="profile-close-btn" data-key="closeBtn">إغلاق</button>
</div>
<!-- الموديل الخاص بالزراير -->
<div id="confirm-modal" class="confirm-modal" role="dialog" aria-modal="true">
  <p style="font-size: large; font-weight: bold;" id="confirm-message"></p>
  <div class="modal-buttons mt-3" style="display: flex; justify-content: space-around;">
    <button id="cancel-btn" data-key="closeBtn" class="btn btn-secondary me-2">إلغاء</button>
    <button id="confirm-btn" data-key="confirmBtn" class="btn btn-danger">تأكيد</button>
  </div>
</div>
<!-- ✅ مودال تسجيل الدخول -->
<div id="profile-login-modal" role="dialog" aria-modal="true" aria-labelledby="profile-login-text">
  <p id="profile-login-text"></p>
  <button id="profile_google_btn" data-key="login" class="google-btn light d-inline-flex align-items-center justify-content-center">
    تسجيل الدخول بجوجل
  </button>
</div>










<script src="./javaScripts/main.js"></script>
<script src="./javaScripts/profile.js"></script>

</body>
</html>
